name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── Restore cached WASM pkg (always runs first) ────────────
      - name: Cache WASM pkg output
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: pkg
          key: ${{ runner.os }}-wasm-pkg-${{ hashFiles('crates/**') }}
          restore-keys: ${{ runner.os }}-wasm-pkg-

      # ── WASM build (only when pkg/ not cached) ─────────────────
      - name: Install Rust and wasm32 target
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Generate Cargo.lock
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: cd crates/ezclaw-core && cargo generate-lockfile

      - name: Install wasm-pack
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-pack

      - name: Build WASM
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          export RUSTFLAGS="-C target-feature=+bulk-memory"
          npm run wasm:build 2>&1

      # ── Container blobs ────────────────────────────────────────
      - name: Cache container blobs
        uses: actions/cache@v4
        with:
          path: containers
          key: container-blobs-v2-${{ runner.os }}

      - name: Build container WASM blobs
        run: |
          mkdir -p containers public/containers
          if [ -f "containers/alpine-amd64.wasm" ] && [ $(stat -c%s "containers/alpine-amd64.wasm") -gt 100000000 ]; then
            echo "Container blob cached ($(stat -c%s containers/alpine-amd64.wasm) bytes), skipping build"
          else
            echo "Downloading c2w binary..."
            curl -sL "https://github.com/container2wasm/container2wasm/releases/download/v0.8.3/container2wasm-v0.8.3-linux-amd64.tar.gz" | tar xz
            chmod +x c2w
            sudo mv c2w /usr/local/bin/

            echo "Building Alpine container blob with container2wasm..."
            c2w --target-arch=amd64 alpine:3.20 containers/alpine-amd64.wasm
            echo "Built: $(stat -c%s containers/alpine-amd64.wasm) bytes"
          fi
          cp containers/*.wasm public/containers/

      # ── Frontend build ─────────────────────────────────────────
      - name: Install dependencies
        run: npm install

      - name: Build Svelte
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ── Deploy ───────────────────────────────────────────────────
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
