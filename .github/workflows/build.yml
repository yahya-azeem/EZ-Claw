name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ── Step 1: Detect what changed ─────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      wasm: ${{ steps.filter.outputs.wasm }}
      frontend: ${{ steps.filter.outputs.frontend }}
      containers: ${{ steps.filter.outputs.containers }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            wasm:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            frontend:
              - 'src/**'
              - 'index.html'
              - 'vite.config.ts'
              - 'tsconfig.json'
              - 'package.json'
              - 'package-lock.json'
              - 'public/**'
            containers:
              - 'public/containers/**'

  # ── Step 2: Build ───────────────────────────────────────────────
  build:
    needs: changes
    # Run if anything relevant changed, or on manual dispatch
    if: >-
      needs.changes.outputs.wasm == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── WASM build (only if crates/ changed) ──────────────────
      - name: Install Rust and wasm32 target
        if: needs.changes.outputs.wasm == 'true' || github.event_name == 'workflow_dispatch'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        if: needs.changes.outputs.wasm == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cache WASM target
        if: needs.changes.outputs.wasm == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: crates/ezclaw-core/target
          key: ${{ runner.os }}-wasm-target-${{ hashFiles('crates/ezclaw-core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-wasm-target-

      - name: Generate Cargo.lock
        if: needs.changes.outputs.wasm == 'true' || github.event_name == 'workflow_dispatch'
        run: cd crates/ezclaw-core && cargo generate-lockfile

      - name: Install wasm-pack
        if: needs.changes.outputs.wasm == 'true' || github.event_name == 'workflow_dispatch'
        run: cargo install wasm-pack

      - name: Build WASM
        if: needs.changes.outputs.wasm == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          export RUSTFLAGS="-C target-feature=+bulk-memory"
          npm run wasm:build 2>&1

      # ── Restore cached WASM pkg (when only frontend changed) ──
      - name: Cache WASM pkg output
        uses: actions/cache@v4
        with:
          path: pkg
          key: ${{ runner.os }}-wasm-pkg-${{ hashFiles('crates/**') }}
          restore-keys: ${{ runner.os }}-wasm-pkg-

      # ── Container blobs ───────────────────────────────────────
      - name: Cache container blobs
        uses: actions/cache@v4
        with:
          path: containers
          key: container-blobs-v2-${{ runner.os }}

      - name: Build container WASM blobs
        run: |
          mkdir -p containers public/containers
          if [ -f "containers/alpine-amd64.wasm" ] && [ $(stat -c%s "containers/alpine-amd64.wasm") -gt 100000000 ]; then
            echo "Container blob cached ($(stat -c%s containers/alpine-amd64.wasm) bytes), skipping build"
          else
            echo "Building Alpine container blob with container2wasm..."
            # Install container2wasm
            go install github.com/container2wasm/container2wasm/cmd/c2w@latest 2>/dev/null || {
              echo "Downloading c2w binary..."
            curl -sL "https://github.com/container2wasm/container2wasm/releases/download/v0.8.3/container2wasm-v0.8.3-linux-amd64.tar.gz" | tar xz
            chmod +x c2w
            sudo mv c2w /usr/local/bin/
            }
            # Build Alpine Linux container → WASM blob
            c2w --target-arch=amd64 alpine:3.20 containers/alpine-amd64.wasm
            echo "Built: $(stat -c%s containers/alpine-amd64.wasm) bytes"
          fi
          cp containers/*.wasm public/containers/

      # ── Frontend build (always runs) ──────────────────────────
      - name: Install dependencies
        run: npm install

      - name: Build Svelte
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ── Step 3: Deploy ──────────────────────────────────────────────
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
